---
- name: "Get PostgreSQL Password"
  hosts: localhost
  connection: local
  gather_facts: no
  
  tasks:
    - name: "Get PostgreSQL password from Parameter Store"
      shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm get-parameter \
          --name "/devops-infra/dev/postgres/password" \
          --with-decryption \
          --query 'Parameter.Value' \
          --output text \
          --region eu-central-1
      register: postgres_password
      
    - name: "Display PostgreSQL password"
      debug:
        msg: "PostgreSQL password: {{ postgres_password.stdout }}"
        
    - name: "Display connection command"
      debug:
        msg: "Connect using: psql -h 10.0.20.205 -p 30432 -U postgres -d appdb"
        
    - name: "Test connection via kubectl"
      shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "echo \"Testing PostgreSQL connection from inside the cluster...\"",
            "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
            "kubectl exec -n database \"$POSTGRES_POD\" -- psql -U postgres -d appdb -c \"SELECT '\''PostgreSQL connection successful! Database version:'\'' as message, version();\""
          ]' \
          --targets "Key=instanceids,Values=i-0d3b536ca803cf53d" \
          --region "eu-central-1" \
          --output text \
          --query 'Command.CommandId'
      register: test_command
      
    - name: "Get test results"
      shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        sleep 10
        aws ssm get-command-invocation \
          --command-id "{{ test_command.stdout }}" \
          --instance-id "i-0d3b536ca803cf53d" \
          --region "eu-central-1" \
          --query 'StandardOutputContent' \
          --output text
      register: test_output
      
    - name: "Display test results"
      debug:
        msg: "{{ test_output.stdout }}" 