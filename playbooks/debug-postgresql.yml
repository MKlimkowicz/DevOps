---
- name: "Debug PostgreSQL Permission Issues"
  hosts: application_nodes
  gather_facts: yes
  
  tasks:
    - name: "🔍 Debug PostgreSQL Permissions and Status"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "echo \"=== PostgreSQL Debug Information ===\"",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "",
            "echo \"=== K8s Cluster Status ===\"",
            "kubectl get nodes -o wide",
            "",
            "echo \"=== PostgreSQL Pods Status ===\"",
            "kubectl get pods -n database -o wide",
            "",
            "echo \"=== PostgreSQL Services ===\"",
            "kubectl get svc -n database",
            "",
            "echo \"=== PostgreSQL PVC Status ===\"",
            "kubectl get pvc -n database -o wide",
            "",
            "echo \"=== PostgreSQL Pod Logs (last 50 lines) ===\"",
            "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\" 2>/dev/null || echo \"none\")",
            "if [ \"$POSTGRES_POD\" != \"none\" ]; then",
            "  echo \"Logs from pod: $POSTGRES_POD\"",
            "  kubectl logs -n database \"$POSTGRES_POD\" --tail=50 || echo \"Could not get logs\"",
            "else",
            "  echo \"No PostgreSQL pod found\"",
            "fi",
            "",
            "echo \"=== Data Directory Permissions ===\"",
            "ls -la /data/",
            "if [ -d \"/data/postgresql\" ]; then",
            "  echo \"PostgreSQL data directory:\"",
            "  ls -la /data/postgresql/",
            "  echo \"Global directory:\"",
            "  ls -la /data/postgresql/global/ 2>/dev/null || echo \"Global directory not found\"",
            "else",
            "  echo \"PostgreSQL data directory not found\"",
            "fi",
            "",
            "echo \"=== Mount Information ===\"",
            "mount | grep data",
            "df -h /data",
            "",
            "echo \"=== PostgreSQL Pod Description ===\"",
            "if [ \"$POSTGRES_POD\" != \"none\" ]; then",
            "  kubectl describe pod -n database \"$POSTGRES_POD\" | tail -20",
            "else",
            "  echo \"No PostgreSQL pod to describe\"",
            "fi",
            "",
            "echo \"=== Test Port Connectivity ===\"",
            "netstat -tlnp | grep :30432 || echo \"Port 30432 not listening\"",
            "",
            "echo \"=== Test Internal PostgreSQL Connection ===\"",
            "if [ \"$POSTGRES_POD\" != \"none\" ]; then",
            "  kubectl exec -n database \"$POSTGRES_POD\" -- id",
            "  kubectl exec -n database \"$POSTGRES_POD\" -- ls -la /bitnami/postgresql/data/ 2>/dev/null || echo \"Could not list internal data directory\"",
            "  kubectl exec -n database \"$POSTGRES_POD\" -- cat /opt/bitnami/postgresql/conf/postgresql.conf | grep -E \"(listen_addresses|port)\" || echo \"Could not read config\"",
            "else",
            "  echo \"Cannot test internal connection - no pod\"",
            "fi"
          ]' \
          --targets "Key=instanceids,Values={{ instance_id }}" \
          --region "{{ aws_region }}" \
          --output text \
          --query 'Command.CommandId'
      register: debug_command
      delegate_to: localhost

    - name: "Wait for debug command"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm wait command-executed \
          --command-id "{{ debug_command.stdout }}" \
          --instance-id "{{ instance_id }}" \
          --region "{{ aws_region }}"
      delegate_to: localhost

    - name: "Get debug results"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm get-command-invocation \
          --command-id "{{ debug_command.stdout }}" \
          --instance-id "{{ instance_id }}" \
          --region "{{ aws_region }}" \
          --query 'StandardOutputContent' \
          --output text
      register: debug_output
      delegate_to: localhost

    - name: "Display Debug Results"
      debug:
        msg: "{{ debug_output.stdout }}" 