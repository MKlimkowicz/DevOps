---
- name: Install and configure K3s cluster
  hosts: kubernetes
  connection: local
  gather_facts: no
  
  vars:
    k3s_version: "latest"
    data_dir: "/data/k3s"
    
  tasks:
    - name: "🔍 Pre-installation Infrastructure Validation"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
            "echo \"=== Pre-Installation Validation ===\"",
            "",
            "# Check if /data is mounted",
            "if mountpoint -q /data; then",
            "  echo \"DATA_MOUNTED=true\"",
            "  echo \"DATA_FILESYSTEM=$(df -T /data | tail -1 | awk '\''{print $2}'\'')\""," 
            "  echo \"DATA_SPACE_AVAILABLE=$(df -h /data | tail -1 | awk '\''{print $4}'\'')\""," 
            "else",
            "  echo \"DATA_MOUNTED=false\"",
            "fi",
            "",
            "# Check if K3s is already installed",
            "if command -v k3s >/dev/null 2>&1; then",
            "  echo \"K3S_EXISTS=true\"",
            "  echo \"K3S_STATUS=$(systemctl is-active k3s 2>/dev/null || echo inactive)\"",
            "else",
            "  echo \"K3S_EXISTS=false\"",
            "fi",
            "",
            "# Check data directory permissions",
            "if [ -d \"/data\" ]; then",
            "  DATA_OWNER=$(stat -c '%U:%G' /data)",
            "  echo \"DATA_OWNER=$DATA_OWNER\"",
            "  if [ -w \"/data\" ]; then",
            "    echo \"DATA_WRITABLE=true\"",
            "  else",
            "    echo \"DATA_WRITABLE=false\"",
            "  fi",
            "else",
            "  echo \"DATA_OWNER=unknown\"",
            "  echo \"DATA_WRITABLE=false\"",
            "fi"
          ]' \
          --targets "Key=instanceids,Values={{ instance_id }}" \
          --region "{{ aws_region }}" \
          --output text \
          --query 'Command.CommandId'
      register: pre_validation_command
      delegate_to: localhost

    - name: "Wait for pre-installation validation"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm wait command-executed \
          --command-id "{{ pre_validation_command.stdout }}" \
          --instance-id "{{ instance_id }}" \
          --region "{{ aws_region }}"
      delegate_to: localhost

    - name: "Get pre-installation validation results"
      ansible.builtin.shell: |
        export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        aws ssm get-command-invocation \
          --command-id "{{ pre_validation_command.stdout }}" \
          --instance-id "{{ instance_id }}" \
          --region "{{ aws_region }}" \
          --query 'StandardOutputContent' \
          --output text
      register: pre_validation_output
      delegate_to: localhost

    - name: "Parse pre-installation status"
      set_fact:
        data_mounted: "{{ 'DATA_MOUNTED=true' in pre_validation_output.stdout }}"
        k3s_exists: "{{ 'K3S_EXISTS=true' in pre_validation_output.stdout }}"
        data_writable: "{{ 'DATA_WRITABLE=true' in pre_validation_output.stdout }}"

    - name: "📊 Display pre-installation status"
      debug:
        msg:
          - "=== Pre-Installation Status on {{ inventory_hostname }} ==="
          - "Data directory mounted: {{ data_mounted }}"
          - "Data directory writable: {{ data_writable }}"
          - "K3s already exists: {{ k3s_exists }}"
          - "Prerequisites check: {{ 'PASS' if (data_mounted and data_writable) else 'FAIL' }}"

    - name: "🚨 Fail if prerequisites not met"
      fail:
        msg: "Prerequisites not met on {{ inventory_hostname }}. Ensure /data is mounted and writable before K3s installation."
      when: not (data_mounted and data_writable)

    - name: "ℹ️ Skip installation if K3s already exists and is healthy"
      debug:
        msg: "K3s already installed on {{ inventory_hostname }}. Skipping installation."
      when: k3s_exists

    - name: Install K3s and configure cluster
      shell: |
        aws ssm send-command \
          --instance-ids "{{ instance_id }}" \
          --document-name "AWS-RunShellScript" \
          --region "{{ aws_region }}" \
          --parameters 'commands=[
            "#!/bin/bash",
            "set -e",
            "echo \"🚀 Installing K3s on {{ inventory_hostname }} ({{ instance_id }})...\"",
            "",
            "# Create data directory",
            "sudo mkdir -p {{ data_dir }}",
            "sudo chmod 755 {{ data_dir }}",
            "",
            "# Install K3s",
            "curl -sfL https://get.k3s.io | sudo INSTALL_K3S_EXEC=\"--write-kubeconfig-mode 644 --disable traefik --data-dir {{ data_dir }}\" sh -",
            "",
            "# Wait for K3s to be ready",
            "echo \"Waiting for K3s to start...\"",
            "sleep 30",
            "until sudo kubectl get nodes >/dev/null 2>&1; do sleep 5; done",
            "",
            "# Install Helm",
            "if ! command -v helm &> /dev/null; then",
            "  echo \"Installing Helm...\"",
            "  curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash",
            "fi",
            "",
            "# Setup kubeconfig for both users",
            "echo \"Setting up kubeconfig for ec2-user and ssm-user...\"",
            "sudo mkdir -p /home/ec2-user/.kube /home/ssm-user/.kube",
            "sudo cp /etc/rancher/k3s/k3s.yaml /home/ec2-user/.kube/config",
            "sudo cp /etc/rancher/k3s/k3s.yaml /home/ssm-user/.kube/config",
            "sudo chown ec2-user:ec2-user /home/ec2-user/.kube/config",
            "sudo chown ssm-user:ssm-user /home/ssm-user/.kube/config",
            "",
            "# Add Helm repositories for root user",
            "echo \"Adding Helm repositories for root user...\"",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "helm repo add bitnami https://charts.bitnami.com/bitnami",
            "helm repo update",
            "",
            "# Add Helm repositories for ec2-user",
            "echo \"Adding Helm repositories for ec2-user...\"",
            "sudo -u ec2-user bash -c \"",
            "  export KUBECONFIG=/home/ec2-user/.kube/config",
            "  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "  helm repo add bitnami https://charts.bitnami.com/bitnami",
            "  helm repo update",
            "\"",
            "",
            "# Add Helm repositories for ssm-user", 
            "echo \"Adding Helm repositories for ssm-user...\"",
            "sudo -u ssm-user bash -c \"",
            "  export KUBECONFIG=/home/ssm-user/.kube/config",
            "  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "  helm repo add bitnami https://charts.bitnami.com/bitnami",
            "  helm repo update",
            "\"",
            "",
            "# Setup user aliases and environment",
            "echo \"Setting up user environment...\"",
            "echo \"alias k=kubectl\" | sudo tee -a /home/ec2-user/.bashrc /home/ssm-user/.bashrc",
            "echo \"export KUBECONFIG=~/.kube/config\" | sudo tee -a /home/ec2-user/.bashrc /home/ssm-user/.bashrc",
            "",
            "# Setup log rotation",
            "sudo tee /etc/logrotate.d/k3s > /dev/null << \"EOF\"",
            "/var/log/k3s.log {",
            "    daily",
            "    rotate 7",
            "    compress",
            "    delaycompress",
            "    missingok",
            "    notifempty",
            "    create 644 root root",
            "}",
            "EOF",
            "",
            "# Final verification",
            "echo \"✅ K3s installation completed on {{ inventory_hostname }}\"",
            "echo \"\"",
            "echo \"=== VERIFICATION ===\"",
            "sudo kubectl cluster-info",
            "sudo kubectl get nodes",
            "sudo kubectl get pods --all-namespaces",
            "echo \"\"",
            "echo \"=== HELM REPOS (ROOT) ===\"",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && helm repo list",
            "echo \"\"",
            "echo \"=== HELM REPOS (EC2-USER) ===\"",
            "sudo -u ec2-user bash -c \"export KUBECONFIG=/home/ec2-user/.kube/config && helm repo list\"",
            "echo \"\"",
            "echo \"=== HELM REPOS (SSM-USER) ===\"",
            "sudo -u ssm-user bash -c \"export KUBECONFIG=/home/ssm-user/.kube/config && helm repo list\"",
            "echo \"\"",
            "echo \"=== USER CONFIGS ===\"",
            "ls -la /home/*/\.kube/config 2>/dev/null || echo \"No user configs found\"",
            "echo \"\"",
            "echo \"🎉 Instance ready for Phase 2!\""
          ]' \
          --output text \
          --query 'Command.CommandId'
      register: command_result
      environment:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
      when: not k3s_exists

    - name: Display command info
      debug:
        msg: "Started K3s installation: {{ command_result.stdout | trim }} on {{ inventory_hostname }}"
      when: not k3s_exists

    - name: Wait for installation completion
      shell: |
        command_id="{{ command_result.stdout | trim }}"
        instance_id="{{ instance_id }}"
        echo "⏳ Installing K3s on {{ inventory_hostname }}... (this may take 3-5 minutes)"
        
        for i in {1..60}; do
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --region "{{ aws_region }}" \
            --query 'Status' \
            --output text 2>/dev/null || echo "InProgress")
          
          if [ "$((i % 6))" -eq 0 ]; then
            echo "{{ inventory_hostname }} - Still working... ($i/60)"
          fi
          
          if [ "$status" = "Success" ]; then
            echo ""
            echo "✅ {{ inventory_hostname }} - K3s installation completed successfully!"
            echo ""
            echo "=== INSTALLATION OUTPUT ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardOutputContent' \
              --output text
            echo "=== END OUTPUT ==="
            exit 0
          elif [ "$status" = "Failed" ]; then
            echo ""
            echo "❌ {{ inventory_hostname }} - Installation failed"
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardOutputContent' \
              --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          
          sleep 10
        done
        
        echo "❌ {{ inventory_hostname }} - Installation timeout"
        exit 1
      environment:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
      when: not k3s_exists
      
    - name: Display success summary
      debug:
        msg: 
          - "🎉 K3s successfully installed on {{ inventory_hostname }}"
          - "📊 Instance: {{ instance_id }} ({{ private_ip }})"
          - "🔌 Connect: aws ssm start-session --target {{ instance_id }} --region {{ aws_region }}"
          - "✅ Test: kubectl get nodes && helm repo list"
          - "🚀 Ready for Phase 2!"
      when: not k3s_exists

    - name: "✅ K3s setup complete"
      debug:
        msg:
          - "K3s setup completed on {{ inventory_hostname }}"
          - "{% if k3s_exists %}ℹ️ K3s was already installed{% else %}🎉 K3s was freshly installed{% endif %}"
          - "Instance ready for application deployment" 