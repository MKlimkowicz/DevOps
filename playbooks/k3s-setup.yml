---
- name: Install and configure K3s cluster
  hosts: kubernetes
  connection: local
  gather_facts: no
  
  vars:
    k3s_version: "latest"
    data_dir: "/data/k3s"
    
  tasks:
    - name: Install K3s and configure cluster
      shell: |
        aws ssm send-command \
          --instance-ids "{{ instance_id }}" \
          --document-name "AWS-RunShellScript" \
          --region "{{ aws_region }}" \
          --parameters 'commands=[
            "#!/bin/bash",
            "set -e",
            "echo \"🚀 Installing K3s on {{ inventory_hostname }} ({{ instance_id }})...\"",
            "",
            "# Create data directory",
            "sudo mkdir -p {{ data_dir }}",
            "sudo chmod 755 {{ data_dir }}",
            "",
            "# Install K3s",
            "curl -sfL https://get.k3s.io | sudo INSTALL_K3S_EXEC=\"--write-kubeconfig-mode 644 --disable traefik --data-dir {{ data_dir }}\" sh -",
            "",
            "# Wait for K3s to be ready",
            "echo \"Waiting for K3s to start...\"",
            "sleep 30",
            "until sudo kubectl get nodes >/dev/null 2>&1; do sleep 5; done",
            "",
            "# Install Helm",
            "if ! command -v helm &> /dev/null; then",
            "  echo \"Installing Helm...\"",
            "  curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash",
            "fi",
            "",
            "# Setup kubeconfig for both users",
            "echo \"Setting up kubeconfig for ec2-user and ssm-user...\"",
            "sudo mkdir -p /home/ec2-user/.kube /home/ssm-user/.kube",
            "sudo cp /etc/rancher/k3s/k3s.yaml /home/ec2-user/.kube/config",
            "sudo cp /etc/rancher/k3s/k3s.yaml /home/ssm-user/.kube/config",
            "sudo chown ec2-user:ec2-user /home/ec2-user/.kube/config",
            "sudo chown ssm-user:ssm-user /home/ssm-user/.kube/config",
            "",
            "# Add Helm repositories for root user",
            "echo \"Adding Helm repositories for root user...\"",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
            "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "helm repo add bitnami https://charts.bitnami.com/bitnami",
            "helm repo update",
            "",
            "# Add Helm repositories for ec2-user",
            "echo \"Adding Helm repositories for ec2-user...\"",
            "sudo -u ec2-user bash -c \"",
            "  export KUBECONFIG=/home/ec2-user/.kube/config",
            "  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "  helm repo add bitnami https://charts.bitnami.com/bitnami",
            "  helm repo update",
            "\"",
            "",
            "# Add Helm repositories for ssm-user", 
            "echo \"Adding Helm repositories for ssm-user...\"",
            "sudo -u ssm-user bash -c \"",
            "  export KUBECONFIG=/home/ssm-user/.kube/config",
            "  helm repo add prometheus-community https://prometheus-community.github.io/helm-charts",
            "  helm repo add bitnami https://charts.bitnami.com/bitnami",
            "  helm repo update",
            "\"",
            "",
            "# Setup user aliases and environment",
            "echo \"Setting up user environment...\"",
            "echo \"alias k=kubectl\" | sudo tee -a /home/ec2-user/.bashrc /home/ssm-user/.bashrc",
            "echo \"export KUBECONFIG=~/.kube/config\" | sudo tee -a /home/ec2-user/.bashrc /home/ssm-user/.bashrc",
            "",
            "# Setup log rotation",
            "sudo tee /etc/logrotate.d/k3s > /dev/null << \"EOF\"",
            "/var/log/k3s.log {",
            "    daily",
            "    rotate 7",
            "    compress",
            "    delaycompress",
            "    missingok",
            "    notifempty",
            "    create 644 root root",
            "}",
            "EOF",
            "",
            "# Final verification",
            "echo \"✅ K3s installation completed on {{ inventory_hostname }}\"",
            "echo \"\"",
            "echo \"=== VERIFICATION ===\"",
            "sudo kubectl cluster-info",
            "sudo kubectl get nodes",
            "sudo kubectl get pods --all-namespaces",
            "echo \"\"",
            "echo \"=== HELM REPOS (ROOT) ===\"",
            "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml && helm repo list",
            "echo \"\"",
            "echo \"=== HELM REPOS (EC2-USER) ===\"",
            "sudo -u ec2-user bash -c \"export KUBECONFIG=/home/ec2-user/.kube/config && helm repo list\"",
            "echo \"\"",
            "echo \"=== HELM REPOS (SSM-USER) ===\"",
            "sudo -u ssm-user bash -c \"export KUBECONFIG=/home/ssm-user/.kube/config && helm repo list\"",
            "echo \"\"",
            "echo \"=== USER CONFIGS ===\"",
            "ls -la /home/*/\.kube/config 2>/dev/null || echo \"No user configs found\"",
            "echo \"\"",
            "echo \"🎉 Instance ready for Phase 2!\""
          ]' \
          --output text \
          --query 'Command.CommandId'
      register: command_result
      environment:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"

    - name: Display command info
      debug:
        msg: "Started K3s installation: {{ command_result.stdout | trim }} on {{ inventory_hostname }}"

    - name: Wait for installation completion
      shell: |
        command_id="{{ command_result.stdout | trim }}"
        instance_id="{{ instance_id }}"
        echo "⏳ Installing K3s on {{ inventory_hostname }}... (this may take 3-5 minutes)"
        
        for i in {1..60}; do
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --region "{{ aws_region }}" \
            --query 'Status' \
            --output text 2>/dev/null || echo "InProgress")
          
          if [ "$((i % 6))" -eq 0 ]; then
            echo "{{ inventory_hostname }} - Still working... ($i/60)"
          fi
          
          if [ "$status" = "Success" ]; then
            echo ""
            echo "✅ {{ inventory_hostname }} - K3s installation completed successfully!"
            echo ""
            echo "=== INSTALLATION OUTPUT ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardOutputContent' \
              --output text
            echo "=== END OUTPUT ==="
            exit 0
          elif [ "$status" = "Failed" ]; then
            echo ""
            echo "❌ {{ inventory_hostname }} - Installation failed"
            echo "=== STDOUT ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardOutputContent' \
              --output text
            echo "=== STDERR ==="
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --region "{{ aws_region }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi
          
          sleep 10
        done
        
        echo "❌ {{ inventory_hostname }} - Installation timeout"
        exit 1
      environment:
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY: "YES"
      
    - name: Display success summary
      debug:
        msg: 
          - "🎉 K3s successfully installed on {{ inventory_hostname }}"
          - "📊 Instance: {{ instance_id }} ({{ private_ip }})"
          - "🔌 Connect: aws ssm start-session --target {{ instance_id }} --region {{ aws_region }}"
          - "✅ Test: kubectl get nodes && helm repo list"
          - "🚀 Ready for Phase 2!" 