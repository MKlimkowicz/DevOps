- name: Update system packages
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["dnf update -y --allowerasing --skip-broken"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: update_command
  delegate_to: localhost

- name: Wait for system update to complete
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ update_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Install required packages
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["dnf install -y docker git wget unzip awscli amazon-ssm-agent"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: install_command
  delegate_to: localhost

- name: Wait for package installation
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ install_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Setup services and directories
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "systemctl enable --now docker amazon-ssm-agent",
        "usermod -aG docker ec2-user",
        "mkdir -p /opt/{k8s/{manifests,configs,logs},terraform-scripts} /data/{prometheus,grafana,postgresql}",
        "chown -R ec2-user:ec2-user /opt/k8s /data"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: setup_command
  delegate_to: localhost

- name: Wait for services setup
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ setup_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Setup EBS volume mounting
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "sleep 10",
        "for dev in nvme1n1 xvdf; do if [ -b \"/dev/$dev\" ] && ! mountpoint -q /data; then mkfs.ext4 -F \"/dev/$dev\" 2>/dev/null || true; mount \"/dev/$dev\" /data; echo \"/dev/$dev /data ext4 defaults,nofail 0 2\" >> /etc/fstab; chown -R ec2-user:ec2-user /data; break; fi; done"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: mount_command
  delegate_to: localhost

- name: Wait for EBS mounting
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ mount_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Deploy Node Exporter via Helm (only on application nodes)
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "until kubectl cluster-info >/dev/null 2>&1; do sleep 10; done",
        "kubectl create namespace monitoring || true",
        "if ! helm list -n monitoring | grep -q node-exporter; then helm upgrade --install node-exporter /opt/k8s/charts/node-exporter --namespace monitoring --wait --timeout=5m; fi"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: nodeexporter_command
  delegate_to: localhost
  when: deploy_database == true

- name: Wait for Node Exporter deployment
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ nodeexporter_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost
  when: deploy_database == true

- name: Setup CloudWatch agent
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "if command -v amazon-cloudwatch-agent-ctl >/dev/null 2>&1; then cat > /tmp/cw-config.json << \"EOF\"",
        "{\"agent\":{\"run_as_user\":\"cwagent\"},\"metrics\":{\"namespace\":\"devops-infra/dev\",\"metrics_collected\":{\"cpu\":{\"measurement\":[\"cpu_usage_idle\"],\"metrics_collection_interval\":300},\"disk\":{\"measurement\":[\"used_percent\"],\"metrics_collection_interval\":300,\"resources\":[\"*\"]},\"mem\":{\"measurement\":[\"mem_used_percent\"],\"metrics_collection_interval\":300}}},\"logs\":{\"logs_collected\":{\"files\":{\"collect_list\":[{\"file_path\":\"/var/log/user-data.log\",\"log_group_name\":\"/aws/ec2/devops-infra-dev\",\"log_stream_name\":\"{instance_id}/user-data.log\"}]}}}}",
        "EOF",
        "amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/tmp/cw-config.json -s; fi"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: cloudwatch_command
  delegate_to: localhost

- name: Wait for CloudWatch setup
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ cloudwatch_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Verify Node Exporter deployment
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== Node Exporter Verification ===\"",
        "kubectl get pods -n monitoring -l app.kubernetes.io/name=node-exporter",
        "echo \"=== Node Exporter Service ===\"", 
        "kubectl get svc -n monitoring node-exporter",
        "echo \"=== Node Exporter Metrics Test ===\"",
        "curl -f -s http://localhost:30100/metrics | head -5 || echo \"Metrics endpoint not ready yet\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: verify_command
  delegate_to: localhost
  when: deploy_database == true

- name: Get verification results
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: verify_output
  delegate_to: localhost
  when: deploy_database == true

- name: Display verification results
  debug:
    msg: "{{ verify_output.stdout }}"
  when: deploy_database == true and verify_output.stdout is defined 