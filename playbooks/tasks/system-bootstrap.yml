- name: Update system packages
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["dnf update -y --allowerasing --skip-broken"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: update_command
  delegate_to: localhost

- name: Wait for system update to complete
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ update_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Install required packages
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["dnf install -y docker git wget unzip awscli amazon-ssm-agent"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: install_command
  delegate_to: localhost

- name: Wait for package installation
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ install_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Setup services and directories
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "systemctl enable --now docker amazon-ssm-agent",
        "usermod -aG docker ec2-user",
        "mkdir -p /opt/{k8s/{manifests,configs,logs},terraform-scripts} /data/{prometheus,grafana,postgresql}",
        "chown -R ec2-user:ec2-user /opt/k8s /data"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: setup_command
  delegate_to: localhost

- name: Wait for services setup
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ setup_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Setup EBS volume mounting
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "sleep 10",
        "# Detect candidate device",
        "CANDIDATE=\"\"; for dev in nvme1n1 xvdf; do if [ -b \"/dev/$dev\" ]; then CANDIDATE=$dev; break; fi; done",
        "if [ -z \"$CANDIDATE\" ]; then echo \"No data device found\"; exit 0; fi",
        "# Check if filesystem exists",
        "if blkid \"/dev/$CANDIDATE\" >/dev/null 2>&1; then HAS_FS=1; else HAS_FS=0; fi",
        "# Optionally create filesystem when explicitly allowed",
        "if [ \"$HAS_FS\" -eq 0 ] && [ \"{{ allow_format_data_volume | default(false) | ternary('true','false') }}\" = \"true\" ]; then mkfs.ext4 -F \"/dev/$CANDIDATE\"; fi",
        "# Ensure mountpoint exists",
        "mkdir -p /data",
        "# Mount if not mounted and ensure idempotent fstab entry",
        "if ! mountpoint -q /data; then grep -q \"^/dev/$CANDIDATE[[:space:]]\+/data[[:space:]]\+ext4\" /etc/fstab || echo \"/dev/$CANDIDATE /data ext4 defaults,nofail 0 2\" >> /etc/fstab; mount /data || true; fi",
        "chown -R ec2-user:ec2-user /data"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: mount_command
  delegate_to: localhost

- name: Wait for EBS mounting
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ mount_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Setup CloudWatch agent
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "if command -v amazon-cloudwatch-agent-ctl >/dev/null 2>&1; then cat > /tmp/cw-config.json << \"EOF\"",
        "{\"agent\":{\"run_as_user\":\"cwagent\"},\"metrics\":{\"namespace\":\"devops-infra/dev\",\"metrics_collected\":{\"cpu\":{\"measurement\":[\"cpu_usage_idle\"],\"metrics_collection_interval\":300},\"disk\":{\"measurement\":[\"used_percent\"],\"metrics_collection_interval\":300,\"resources\":[\"*\"]},\"mem\":{\"measurement\":[\"mem_used_percent\"],\"metrics_collection_interval\":300}}},\"logs\":{\"logs_collected\":{\"files\":{\"collect_list\":[{\"file_path\":\"/var/log/user-data.log\",\"log_group_name\":\"/aws/ec2/devops-infra-dev\",\"log_stream_name\":\"{instance_id}/user-data.log\"}]}}}}",
        "EOF",
        "amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/tmp/cw-config.json -s; fi"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: cloudwatch_command
  delegate_to: localhost

- name: Wait for CloudWatch setup
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ cloudwatch_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Final system bootstrap verification"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "echo \"=== System Bootstrap Verification ===\"",
        "echo \"=== Docker Status ===\"",
        "systemctl is-active docker",
        "echo \"=== SSM Agent Status ===\"", 
        "systemctl is-active amazon-ssm-agent",
        "echo \"=== K3s Status ===\"",
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "kubectl cluster-info",
        "echo \"=== Disk Usage ===\"",
        "df -h | grep -E \"(Filesystem|/data|/$)\"",
        "echo \"=== System Bootstrap Complete ✅ ===\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: final_verify_command
  delegate_to: localhost

- name: "Get system bootstrap verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ final_verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: final_verify_output
  delegate_to: localhost
  retries: 3
  delay: 10
  until: final_verify_output.stdout is defined

- name: "Display system bootstrap results"
  debug:
    msg: "{{ final_verify_output.stdout }}" 