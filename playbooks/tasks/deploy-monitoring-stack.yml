---
- name: "Get Grafana admin password from Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/grafana/admin-password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: grafana_password_check
  delegate_to: localhost
  failed_when: false

- name: "Generate and store Grafana admin password if missing"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    RANDOM_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-20)
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/grafana/admin-password" \
      --value "$RANDOM_PASSWORD" \
      --type "SecureString" \
      --description "Grafana admin password for {{ project_name | default('devops-infra') }} {{ deployment_environment | default('dev') }} environment" \
      --region "{{ aws_region }}"
    echo "$RANDOM_PASSWORD"
  register: grafana_password_create
  delegate_to: localhost
  when: grafana_password_check.rc != 0

- name: "Get Grafana admin password"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/grafana/admin-password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: grafana_password_result
  delegate_to: localhost

- name: "Create monitoring namespace"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "kubectl create namespace monitoring || true"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: namespace_command
  delegate_to: localhost

- name: "Deploy kube-prometheus-stack via Helm"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Installing kube-prometheus-stack...\"",
        "helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack --namespace monitoring --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.resources.requests.storage=10Gi --set prometheus.prometheusSpec.storageSpec.volumeClaimTemplate.spec.storageClassName=local-path --set prometheus.prometheusSpec.retention=7d --set grafana.adminPassword=\"{{ grafana_password_result.stdout }}\" --set grafana.persistence.enabled=true --set grafana.persistence.size=5Gi --set grafana.persistence.storageClassName=local-path --set grafana.service.type=NodePort --set grafana.service.nodePort=30000 --set prometheus.service.type=NodePort --set prometheus.service.nodePort=30001 --set alertmanager.service.type=NodePort --set alertmanager.service.nodePort=30002 --set grafana.sidecar.datasources.enabled=true --set grafana.sidecar.dashboards.enabled=true --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false --set prometheus.prometheusSpec.ruleSelectorNilUsesHelmValues=false --wait --timeout=15m"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: monitoring_deploy_command
  delegate_to: localhost

- name: "Wait for monitoring stack deployment to complete"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ monitoring_deploy_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: monitoring_deploy_output
  delegate_to: localhost
  retries: 15
  delay: 60
  until: monitoring_deploy_output.stdout is defined

- name: "Create additional Grafana service for ALB"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Creating additional Grafana service for ALB...\"",
        "cat > /tmp/grafana-alb-service.yaml << EOF",
        "apiVersion: v1",
        "kind: Service",
        "metadata:",
        "  name: grafana-alb",
        "  namespace: monitoring",
        "spec:",
        "  type: NodePort",
        "  ports:",
        "  - port: 3000",
        "    targetPort: 3000",
        "    nodePort: 30003",
        "  selector:",
        "    app.kubernetes.io/name: grafana",
        "    app.kubernetes.io/instance: kube-prometheus-stack",
        "EOF",
        "kubectl apply -f /tmp/grafana-alb-service.yaml"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: grafana_alb_command
  delegate_to: localhost

- name: "Wait for monitoring pods to be ready"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Waiting for monitoring pods to be ready...\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=grafana -n monitoring --timeout=600s || echo \"Grafana timeout\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=prometheus -n monitoring --timeout=600s || echo \"Prometheus timeout\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=alertmanager -n monitoring --timeout=600s || echo \"AlertManager timeout\"",
        "echo \"Monitoring pods status:\"",
        "kubectl get pods -n monitoring"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: wait_pods_command
  delegate_to: localhost

- name: "Get monitoring pods status"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ wait_pods_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: pods_status_output
  delegate_to: localhost
  retries: 10
  delay: 30
  until: pods_status_output.stdout is defined

- name: "Verify monitoring stack basic functionality"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== Monitoring Stack Basic Verification ===\"",
        "echo \"1. Services:\"",
        "kubectl get svc -n monitoring",
        "echo \"\"",
        "echo \"2. Persistent Volumes:\"",
        "kubectl get pvc -n monitoring",
        "echo \"\"",
        "echo \"3. Prometheus Health Check:\"",
        "timeout 30 curl -f -s http://localhost:30001/-/healthy || echo \"Prometheus not ready\"",
        "echo \"\"",
        "echo \"4. Grafana Health Check:\"",
        "timeout 30 curl -f -s http://localhost:30000/api/health || echo \"Grafana not ready\"",
        "echo \"\"",
        "echo \"5. AlertManager Health Check:\"",
        "timeout 30 curl -f -s http://localhost:30002/-/healthy || echo \"AlertManager not ready\"",
        "echo \"=== Basic verification complete ===\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: basic_verify_command
  delegate_to: localhost

- name: "Get basic verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ basic_verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: basic_verify_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: basic_verify_output.stdout is defined

- name: "Display monitoring stack status"
  debug:
    msg: |
      ============================================
      📊 Monitoring Stack Deployment Status
      ============================================
      {{ basic_verify_output.stdout }}
      ============================================ 