---
- name: "Read Grafana admin password (Terraform-managed)"
  community.aws.aws_ssm_parameter_store:
    name: "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/grafana/admin-password"
    with_decryption: true
    state: get
    region: "{{ aws_region }}"
  register: grafana_password_param
  delegate_to: localhost
  failed_when: grafana_password_param.value is not defined or grafana_password_param.value == ""

- name: "Create monitoring namespace"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl create namespace monitoring || true
  become: true

- name: "Deploy kube-prometheus-stack via Helm"
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    values:
      prometheus:
        service:
          type: NodePort
          nodePort: 30001
        prometheusSpec:
          storageSpec:
            volumeClaimTemplate:
              spec:
                resources:
                  requests:
                    storage: 10Gi
                storageClassName: local-path
          retention: 7d
          serviceMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
      grafana:
        adminPassword: "{{ grafana_password_param.value }}"
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: local-path
        service:
          type: NodePort
          nodePort: 30000
        sidecar:
          datasources:
            enabled: true
          dashboards:
            enabled: true
      alertmanager:
        service:
          type: NodePort
          nodePort: 30002
      prometheusOperator: {}
      kube-state-metrics: {}
    wait: true
    timeout: 900
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  become: true

- name: "Create additional Grafana service for ALB"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: grafana-alb
        namespace: monitoring
      spec:
        type: NodePort
        ports:
          - port: 3000
            targetPort: 3000
            nodePort: 30003
        selector:
          app.kubernetes.io/name: grafana
          app.kubernetes.io/instance: kube-prometheus-stack
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  become: true

- name: "Wait for monitoring pods to be ready"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    echo "Waiting for monitoring pods to be ready..."
    kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=grafana -n monitoring --timeout=600s || echo "Grafana timeout"
    kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=prometheus -n monitoring --timeout=600s || echo "Prometheus timeout"
    kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=alertmanager -n monitoring --timeout=600s || echo "AlertManager timeout"
    echo "Monitoring pods status:"
    kubectl get pods -n monitoring
  become: true

- name: "Verify monitoring stack basic functionality"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    echo "=== Monitoring Stack Basic Verification ==="
    echo "1. Services:"
    kubectl get svc -n monitoring
    echo ""
    echo "2. Persistent Volumes:"
    kubectl get pvc -n monitoring
    echo ""
    echo "3. Prometheus Health Check:"
    timeout 30 curl -f -s http://localhost:30001/-/healthy || echo "Prometheus not ready"
    echo ""
    echo "4. Grafana Health Check:"
    timeout 30 curl -f -s http://localhost:30000/api/health || echo "Grafana not ready"
    echo ""
    echo "5. AlertManager Health Check:"
    timeout 30 curl -f -s http://localhost:30002/-/healthy || echo "AlertManager not ready"
    echo "=== Basic verification complete ==="
  become: true 