---
- name: "Check if PostgreSQL password exists in Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: postgres_password_check
  delegate_to: localhost
  failed_when: false

- name: "Generate and store PostgreSQL password if missing"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    RANDOM_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --value "$RANDOM_PASSWORD" \
      --type "SecureString" \
      --description "PostgreSQL password for {{ project_name | default('devops-infra') }} {{ deployment_environment | default('dev') }} environment" \
      --region "{{ aws_region }}"
    echo "$RANDOM_PASSWORD"
  register: postgres_password_create
  delegate_to: localhost
  when: postgres_password_check.rc != 0

- name: "Get PostgreSQL password from Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: postgres_password_result
  delegate_to: localhost

- name: "Create database namespace"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "kubectl create namespace database || true"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: namespace_command
  delegate_to: localhost

- name: "Check for existing conflicting deployments"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== Checking for existing PostgreSQL deployments ===\"",
        "kubectl get pods,svc -n database 2>/dev/null || echo \"No database resources found\"",
        "echo \"=== Checking port 30432 usage ===\"",
        "netstat -tuln | grep :30432 || echo \"Port 30432 available\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: conflict_check_command
  delegate_to: localhost

- name: "Deploy PostgreSQL using Bitnami chart"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "helm upgrade --install postgresql bitnami/postgresql --namespace database --set auth.postgresPassword=\"{{ postgres_password_result.stdout }}\" --set auth.database=\"appdb\" --set primary.persistence.enabled=true --set primary.persistence.size=10Gi --set primary.service.type=NodePort --set primary.service.nodePorts.postgresql=30432 --wait --timeout=10m"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: postgresql_deploy_command
  delegate_to: localhost

- name: "Wait for PostgreSQL deployment to complete"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ postgresql_deploy_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: postgresql_deploy_output
  delegate_to: localhost
  retries: 10
  delay: 30
  until: postgresql_deploy_output.stdout is defined

- name: "Create sample data for testing (optional)"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Waiting for PostgreSQL to be ready...\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s",
        "echo \"Creating sample table for testing...\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "kubectl exec -n database \"$POSTGRES_POD\" -- psql -U postgres -d appdb -c \"CREATE TABLE IF NOT EXISTS sample_metrics (id SERIAL PRIMARY KEY, timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP, metric_name VARCHAR(100), metric_value FLOAT, instance_id VARCHAR(50));\"",
        "kubectl exec -n database \"$POSTGRES_POD\" -- psql -U postgres -d appdb -c \"INSERT INTO sample_metrics (metric_name, metric_value, instance_id) VALUES ('"'cpu_usage'"', 45.2, '"'test-instance'"'), ('"'memory_usage'"', 67.8, '"'test-instance'"'), ('"'disk_usage'"', 23.1, '"'test-instance'"');\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: sample_data_command
  delegate_to: localhost
  when: create_sample_data | default(true)

- name: "Deploy PostgreSQL Exporter"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Deploying PostgreSQL Exporter...\"",
        "cat > /tmp/postgres-exporter.yaml << EOF",
        "apiVersion: apps/v1",
        "kind: Deployment",
        "metadata:",
        "  name: postgres-exporter",
        "  namespace: database",
        "  labels:",
        "    app: postgres-exporter",
        "spec:",
        "  replicas: 1",
        "  selector:",
        "    matchLabels:",
        "      app: postgres-exporter",
        "  template:",
        "    metadata:",
        "      labels:",
        "        app: postgres-exporter",
        "    spec:",
        "      containers:",
        "      - name: postgres-exporter",
        "        image: prometheuscommunity/postgres-exporter:v0.15.0",
        "        ports:",
        "        - containerPort: 9187",
        "          name: metrics",
        "        env:",
        "        - name: DATA_SOURCE_NAME",
        "          valueFrom:",
        "            secretKeyRef:",
        "              name: postgres-exporter-secret",
        "              key: dsn",
        "        - name: PG_EXPORTER_WEB_LISTEN_ADDRESS",
        "          value: \"0.0.0.0:9187\"",
        "        resources:",
        "          limits:",
        "            cpu: 200m",
        "            memory: 256Mi",
        "          requests:",
        "            cpu: 100m",
        "            memory: 128Mi",
        "        livenessProbe:",
        "          httpGet:",
        "            path: /metrics",
        "            port: 9187",
        "          initialDelaySeconds: 60",
        "          periodSeconds: 30",
        "        readinessProbe:",
        "          httpGet:",
        "            path: /metrics",
        "            port: 9187",
        "          initialDelaySeconds: 30",
        "          periodSeconds: 10",
        "---",
        "apiVersion: v1",
        "kind: Secret",
        "metadata:",
        "  name: postgres-exporter-secret",
        "  namespace: database",
        "type: Opaque",
        "stringData:",
        "  dsn: \"postgresql://postgres:{{ postgres_password_result.stdout }}@postgresql.database.svc.cluster.local:5432/appdb?sslmode=disable\"",
        "---",
        "apiVersion: v1",
        "kind: Service",
        "metadata:",
        "  name: postgres-exporter",
        "  namespace: database",
        "  labels:",
        "    app: postgres-exporter",
        "spec:",
        "  ports:",
        "  - port: 9187",
        "    targetPort: 9187",
        "    nodePort: 30187",
        "    name: metrics",
        "    protocol: TCP",
        "  selector:",
        "    app: postgres-exporter",
        "  type: NodePort",
        "EOF",
        "kubectl apply -f /tmp/postgres-exporter.yaml"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: exporter_deploy_command
  delegate_to: localhost

- name: "Verify PostgreSQL deployment"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== PostgreSQL Pods ===\"",
        "kubectl get pods -n database -l app.kubernetes.io/name=postgresql",
        "echo \"=== PostgreSQL Services ===\"", 
        "kubectl get svc -n database",
        "echo \"=== PostgreSQL Persistence ===\"",
        "kubectl get pvc -n database",
        "echo \"=== PostgreSQL Exporter Pods ===\"",
        "kubectl get pods -n database -l app=postgres-exporter",
        "echo \"=== Database Connectivity Test ===\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "kubectl exec -n database \"$POSTGRES_POD\" -- psql -U postgres -d appdb -c \"SELECT version();\"",
        "echo \"=== Testing PostgreSQL Exporter connectivity ===\"",
        "kubectl wait --for=condition=ready pod -l app=postgres-exporter -n database --timeout=300s || true"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: verify_command
  delegate_to: localhost

- name: "Get PostgreSQL verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: verify_output
  delegate_to: localhost

- name: "Store database instance private IP"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["curl -s http://169.254.169.254/latest/meta-data/private-ipv4"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId')
    
    echo "Command ID: $COMMAND_ID"
    sleep 10
    
    for i in {1..5}; do
      PRIVATE_IP=$(aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "{{ instance_id }}" \
        --region "{{ aws_region }}" \
        --query 'StandardOutputContent' \
        --output text 2>/dev/null | tr -d '\n\r' | xargs)
      
      if [[ -n "$PRIVATE_IP" && "$PRIVATE_IP" != "None" ]]; then
        echo "$PRIVATE_IP"
        break
      fi
      
      echo "Attempt $i/5: Waiting for private IP..."
      sleep 5
    done
    
    if [[ -z "$PRIVATE_IP" || "$PRIVATE_IP" == "None" ]]; then
      echo "Failed to get private IP, using fallback"
      echo "10.0.20.81"
    else
      echo "$PRIVATE_IP"
    fi
  register: private_ip_result
  delegate_to: localhost

- name: "Store private IP in Parameter Store for monitoring instance"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/private-ip" \
      --value "{{ private_ip_result.stdout }}" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Display PostgreSQL deployment summary"
  debug:
    msg: |
      ============================================
      ✅ PostgreSQL Database Deployment Complete!
      ============================================
      📍 Database Access Information:
         Host: {{ private_ip_result.stdout }}:30432
         Database: appdb
         Username: postgres
         Password: {{ "Newly generated and stored" if postgres_password_check.rc != 0 else "Retrieved from Parameter Store" }}
      
      📊 Monitoring Endpoints:
         PostgreSQL Exporter: {{ private_ip_result.stdout }}:30187/metrics
         Node Exporter: {{ private_ip_result.stdout }}:30100/metrics
      
      🔧 Kubernetes Resources:
      {{ verify_output.stdout }}
      ============================================ 