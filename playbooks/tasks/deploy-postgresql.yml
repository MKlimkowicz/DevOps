---
- name: "Check if PostgreSQL password exists in Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: postgres_password_check
  delegate_to: localhost
  failed_when: false

- name: "Generate and store PostgreSQL password if missing"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    RANDOM_PASSWORD=$(openssl rand -base64 32 | tr -d "=+/" | cut -c1-25)
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --value "$RANDOM_PASSWORD" \
      --type "SecureString" \
      --description "PostgreSQL password for {{ project_name | default('devops-infra') }} {{ deployment_environment | default('dev') }} environment" \
      --region "{{ aws_region }}"
    echo "$RANDOM_PASSWORD"
  register: postgres_password_create
  delegate_to: localhost
  when: postgres_password_check.rc != 0

- name: "Get PostgreSQL password from Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password" \
      --with-decryption \
      --query 'Parameter.Value' \
      --output text \
      --region "{{ aws_region }}"
  register: postgres_password_result
  delegate_to: localhost

- name: "Get instance private IP with fallback"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    
    # Try to get private IP from EC2 metadata
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["hostname -I | awk \"{print \\$1}\" || curl -s http://169.254.169.254/latest/meta-data/private-ipv4 || echo \"10.0.20.81\""]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId')
    
    sleep 15
    
    for i in {1..3}; do
      PRIVATE_IP=$(aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "{{ instance_id }}" \
        --region "{{ aws_region }}" \
        --query 'StandardOutputContent' \
        --output text 2>/dev/null | tr -d '\n\r ' | head -1)
      
      if [[ -n "$PRIVATE_IP" && "$PRIVATE_IP" != "None" && "$PRIVATE_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
        echo "$PRIVATE_IP"
        exit 0
      fi
      
      sleep 5
    done
    
    # Fallback to known IP if all methods fail
    echo "10.0.20.81"
  register: private_ip_result
  delegate_to: localhost

- name: "Create database namespace"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "kubectl create namespace database || true"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: namespace_command
  delegate_to: localhost

- name: "Check for existing conflicting deployments"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== Checking for existing PostgreSQL deployments ===\"",
        "kubectl get pods,svc -n database 2>/dev/null || echo \"No database resources found\"",
        "echo \"=== Checking port usage ===\"",
        "ss -tuln | grep -E \":(30432|30187)\" || echo \"Ports 30432 and 30187 available\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: conflict_check_command
  delegate_to: localhost

- name: "🔧 Fix PostgreSQL data directory permissions"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "echo \"🔧 Fixing PostgreSQL data directory permissions...\"",
        "",
        "# Create PostgreSQL data directory if it doesn'"'"'t exist",
        "sudo mkdir -p /data/postgresql",
        "",
        "# Fix ownership - PostgreSQL Bitnami image runs as UID 1001",
        "echo \"Setting ownership to UID 1001 (PostgreSQL user)...\"",
        "sudo chown -R 1001:1001 /data/postgresql",
        "",
        "# Set proper permissions",
        "sudo chmod 755 /data/postgresql",
        "",
        "# Clean any existing broken data",
        "echo \"Cleaning any existing corrupted data...\"",
        "sudo rm -rf /data/postgresql/*",
        "",
        "# Verify permissions",
        "echo \"=== PostgreSQL Data Directory Status ===\"",
        "ls -la /data/postgresql",
        "echo \"Owner: $(stat -c '%U:%G' /data/postgresql 2>/dev/null || echo 'unknown')\"",
        "echo \"Permissions: $(stat -c '%a' /data/postgresql 2>/dev/null || echo 'unknown')\"",
        "",
        "echo \"✅ PostgreSQL data directory permissions fixed\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: fix_permissions_command
  delegate_to: localhost

- name: "Wait for permissions fix"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ fix_permissions_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Get permissions fix results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ fix_permissions_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: fix_permissions_output
  delegate_to: localhost

- name: "Display permissions fix results"
  debug:
    msg: "{{ fix_permissions_output.stdout }}"

- name: "🗑️ Remove existing PostgreSQL deployment (if any)"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Removing any existing PostgreSQL deployment...\"",
        "helm uninstall postgresql -n database 2>/dev/null || echo \"No existing PostgreSQL deployment found\"",
        "",
        "# Wait a moment for cleanup",
        "sleep 10",
        "",
        "# Clean up any remaining resources",
        "kubectl delete pod -n database -l app.kubernetes.io/name=postgresql --force --grace-period=0 2>/dev/null || true",
        "kubectl delete pvc -n database -l app.kubernetes.io/name=postgresql 2>/dev/null || true",
        "",
        "echo \"✅ Cleanup completed\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: cleanup_command
  delegate_to: localhost

- name: "Wait for cleanup"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ cleanup_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Deploy PostgreSQL using Bitnami chart"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"🚀 Deploying PostgreSQL with proper configuration...\"",
        "",
        "# Deploy with correct persistence settings and security context",
        "helm upgrade --install postgresql bitnami/postgresql --namespace database --set auth.postgresPassword=\"{{ postgres_password_result.stdout }}\" --set auth.database=\"appdb\" --set primary.persistence.enabled=true --set primary.persistence.size=10Gi --set primary.persistence.storageClass=\"local-path\" --set primary.persistence.existingClaim=\"\" --set primary.securityContext.enabled=true --set primary.securityContext.fsGroup=1001 --set primary.containerSecurityContext.enabled=true --set primary.containerSecurityContext.runAsUser=1001 --set primary.containerSecurityContext.runAsGroup=1001 --set primary.service.type=NodePort --set primary.service.nodePorts.postgresql=30432 --set primary.initdb.scripts.\"init-db\\.sql\"=\"CREATE EXTENSION IF NOT EXISTS pg_stat_statements;\" --wait --timeout=15m",
        "",
        "echo \"✅ PostgreSQL deployment command completed\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: postgresql_deploy_command
  delegate_to: localhost

- name: "Wait for PostgreSQL deployment to complete"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ postgresql_deploy_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: postgresql_deploy_output
  delegate_to: localhost
  retries: 10
  delay: 30
  until: postgresql_deploy_output.stdout is defined

- name: "Display PostgreSQL deployment results"
  debug:
    msg: "{{ postgresql_deploy_output.stdout }}"

- name: "🔍 Verify PostgreSQL deployment and connectivity"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== PostgreSQL Deployment Verification ===\"",
        "",
        "# Wait for PostgreSQL pod to be ready",
        "echo \"Waiting for PostgreSQL pod to be ready...\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s",
        "",
        "# Check pod status",
        "echo \"=== Pod Status ===\"",
        "kubectl get pods -n database -o wide",
        "",
        "# Check service status",
        "echo \"=== Service Status ===\"",
        "kubectl get svc -n database",
        "",
        "# Check PVC status",
        "echo \"=== Persistent Volume Claim Status ===\"",
        "kubectl get pvc -n database -o wide",
        "",
        "# Test internal PostgreSQL connectivity",
        "echo \"=== Testing PostgreSQL Connectivity ===\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "if [ -n \"$POSTGRES_POD\" ]; then",
        "  echo \"Testing connection to PostgreSQL pod: $POSTGRES_POD\"",
        "  kubectl exec -n database \"$POSTGRES_POD\" -- pg_isready -U postgres -d appdb || echo \"PostgreSQL not ready yet\"",
        "  kubectl exec -n database \"$POSTGRES_POD\" -- psql -U postgres -d appdb -c \"SELECT version();\" || echo \"Could not query PostgreSQL\"",
        "else",
        "  echo \"❌ No PostgreSQL pod found\"",
        "fi",
        "",
        "# Test NodePort connectivity",
        "echo \"=== Testing NodePort Access ===\"",
        "netstat -tlnp | grep :30432 || echo \"Port 30432 not listening\"",
        "",
        "# Check data directory inside pod",
        "echo \"=== Checking Data Directory in Pod ===\"",
        "if [ -n \"$POSTGRES_POD\" ]; then",
        "  kubectl exec -n database \"$POSTGRES_POD\" -- ls -la /bitnami/postgresql/data/ || echo \"Could not list data directory\"",
        "  kubectl exec -n database \"$POSTGRES_POD\" -- id || echo \"Could not get user info\"",
        "fi",
        "",
        "# Check host data directory permissions",
        "echo \"=== Host Data Directory Permissions ===\"",
        "ls -la /data/postgresql/",
        "echo \"Owner: $(stat -c '%U:%G' /data/postgresql 2>/dev/null || echo 'unknown')\"",
        "",
        "echo \"✅ PostgreSQL verification completed\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: verify_postgresql_command
  delegate_to: localhost

- name: "Wait for PostgreSQL verification"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ verify_postgresql_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Get PostgreSQL verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ verify_postgresql_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: verify_postgresql_output
  delegate_to: localhost

- name: "Display PostgreSQL verification results"
  debug:
    msg: "{{ verify_postgresql_output.stdout }}"

- name: "Deploy PostgreSQL Exporter"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Deploying PostgreSQL Exporter...\"",
        "cat > /tmp/postgres-exporter.yaml << EOF",
        "apiVersion: apps/v1",
        "kind: Deployment",
        "metadata:",
        "  name: postgres-exporter",
        "  namespace: database",
        "  labels:",
        "    app: postgres-exporter",
        "spec:",
        "  replicas: 1",
        "  selector:",
        "    matchLabels:",
        "      app: postgres-exporter",
        "  template:",
        "    metadata:",
        "      labels:",
        "        app: postgres-exporter",
        "    spec:",
        "      containers:",
        "      - name: postgres-exporter",
        "        image: prometheuscommunity/postgres-exporter:v0.15.0",
        "        ports:",
        "        - containerPort: 9187",
        "          name: metrics",
        "        env:",
        "        - name: DATA_SOURCE_NAME",
        "          valueFrom:",
        "            secretKeyRef:",
        "              name: postgres-exporter-secret",
        "              key: dsn",
        "        - name: PG_EXPORTER_WEB_LISTEN_ADDRESS",
        "          value: \"0.0.0.0:9187\"",
        "        resources:",
        "          limits:",
        "            cpu: 200m",
        "            memory: 256Mi",
        "          requests:",
        "            cpu: 100m",
        "            memory: 128Mi",
        "        livenessProbe:",
        "          httpGet:",
        "            path: /metrics",
        "            port: 9187",
        "          initialDelaySeconds: 60",
        "          periodSeconds: 30",
        "        readinessProbe:",
        "          httpGet:",
        "            path: /metrics",
        "            port: 9187",
        "          initialDelaySeconds: 30",
        "          periodSeconds: 10",
        "---",
        "apiVersion: v1",
        "kind: Secret",
        "metadata:",
        "  name: postgres-exporter-secret",
        "  namespace: database",
        "type: Opaque",
        "stringData:",
        "  dsn: \"postgresql://postgres:{{ postgres_password_result.stdout }}@postgresql.database.svc.cluster.local:5432/appdb?sslmode=disable\"",
        "---",
        "apiVersion: v1",
        "kind: Service",
        "metadata:",
        "  name: postgres-exporter",
        "  namespace: database",
        "  labels:",
        "    app: postgres-exporter",
        "spec:",
        "  ports:",
        "  - port: 9187",
        "    targetPort: 9187",
        "    nodePort: 30187",
        "    name: metrics",
        "    protocol: TCP",
        "  selector:",
        "    app: postgres-exporter",
        "  type: NodePort",
        "EOF",
        "kubectl apply -f /tmp/postgres-exporter.yaml"
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: exporter_deploy_command
  delegate_to: localhost

- name: "Wait for PostgreSQL Exporter deployment"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ exporter_deploy_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: exporter_deploy_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: exporter_deploy_output.stdout is defined

- name: "Create sample data for testing (optional)"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Waiting for PostgreSQL to be ready...\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s",
        "echo \"Creating sample table for testing...\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "POSTGRES_PASSWORD=$(kubectl get secret -n database postgresql -o jsonpath=\"{.data.postgres-password}\" | base64 -d)",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"CREATE TABLE IF NOT EXISTS sample_metrics (id SERIAL PRIMARY KEY, timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP, metric_name VARCHAR(100), metric_value FLOAT, instance_id VARCHAR(50));\"",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"INSERT INTO sample_metrics (metric_name, metric_value, instance_id) VALUES ('"'cpu_usage'"', 45.2, '"'test-instance'"'), ('"'memory_usage'"', 67.8, '"'test-instance'"'), ('"'disk_usage'"', 23.1, '"'test-instance'"') ON CONFLICT DO NOTHING;\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: sample_data_command
  delegate_to: localhost
  when: create_sample_data | default(true)

- name: "Wait for sample data creation"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ sample_data_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: sample_data_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: sample_data_output.stdout is defined
  when: create_sample_data | default(true)

- name: "Comprehensive automated verification"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== PostgreSQL Deployment Verification ===\"",
        "echo \"1. Checking PostgreSQL Pods:\"",
        "kubectl get pods -n database -l app.kubernetes.io/name=postgresql",
        "echo \"\"",
        "echo \"2. Checking PostgreSQL Services:\"", 
        "kubectl get svc -n database",
        "echo \"\"",
        "echo \"3. Checking Persistence:\"",
        "kubectl get pvc -n database",
        "echo \"\"",
        "echo \"4. Checking PostgreSQL Exporter:\"",
        "kubectl get pods -n database -l app=postgres-exporter",
        "echo \"\"",
        "echo \"5. Testing Database Connection:\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "POSTGRES_PASSWORD=$(kubectl get secret -n database postgresql -o jsonpath=\"{.data.postgres-password}\" | base64 -d)",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"SELECT version();\"",
        "echo \"\"",
        "echo \"6. Testing Sample Data:\"",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"SELECT COUNT(*) as sample_records FROM sample_metrics;\" || echo \"Sample data not created\"",
        "echo \"\"",
        "echo \"7. Testing PostgreSQL Exporter Connectivity:\"",
        "kubectl wait --for=condition=ready pod -l app=postgres-exporter -n database --timeout=120s || echo \"PostgreSQL Exporter not ready yet\"",
        "NODE_IP=$(hostname -I | awk \"{print \\$1}\" || echo \"{{ private_ip_result.stdout }}\")",
        "echo \"Node IP: $NODE_IP\"",
        "curl -s http://$NODE_IP:30187/metrics | grep pg_up || echo \"PostgreSQL Exporter metrics not accessible yet\"",
        "echo \"\"",
        "echo \"8. Testing External Port Connectivity:\"",
        "timeout 5 bash -c \"</dev/tcp/$NODE_IP/30432\" && echo \"PostgreSQL port 30432 accessible\" || echo \"PostgreSQL port 30432 connection failed (normal for PostgreSQL)\"",
        "timeout 5 bash -c \"</dev/tcp/$NODE_IP/30187\" && echo \"PostgreSQL Exporter port 30187 accessible\" || echo \"PostgreSQL Exporter port 30187 connection failed\"",
        "echo \"\"",
        "echo \"=== Deployment Summary ===\"",
        "echo \"PostgreSQL Host: $NODE_IP:30432\"",
        "echo \"PostgreSQL Exporter: $NODE_IP:30187/metrics\"",
        "echo \"Database: appdb\"",
        "echo \"Username: postgres\"",
        "echo \"Password: Stored in Parameter Store and Kubernetes Secret\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: verify_command
  delegate_to: localhost

- name: "Get comprehensive verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: verify_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: verify_output.stdout is defined

- name: "Store private IP in Parameter Store for monitoring instance"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/private-ip" \
      --value "{{ private_ip_result.stdout }}" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Store database connection details in Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/host" \
      --value "{{ private_ip_result.stdout }}" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/port" \
      --value "30432" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/name" \
      --value "appdb" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/username" \
      --value "postgres" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/monitoring/postgres-exporter-url" \
      --value "http://{{ private_ip_result.stdout }}:30187/metrics" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
  delegate_to: localhost

