---
- name: "Read PostgreSQL password (Terraform-managed)"
  community.aws.aws_ssm_parameter_store:
    name: "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password"
    with_decryption: true
    state: get
    region: "{{ aws_region }}"
  register: postgres_password_param
  delegate_to: localhost
  failed_when: postgres_password_param.value is not defined or postgres_password_param.value == ""

- name: "Get instance private IP with fallback"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    
    # Try to get private IP from EC2 metadata
    COMMAND_ID=$(aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["hostname -I | awk "{print \\$1}" || curl -s http://169.254.169.254/latest/meta-data/private-ipv4 || echo "10.0.20.81""]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId')
    
    sleep 15
    
    for i in {1..3}; do
      PRIVATE_IP=$(aws ssm get-command-invocation \
        --command-id "$COMMAND_ID" \
        --instance-id "{{ instance_id }}" \
        --region "{{ aws_region }}" \
        --query 'StandardOutputContent' \
        --output text 2>/dev/null | tr -d '\n\r ' | head -1)
      
      if [[ -n "$PRIVATE_IP" && "$PRIVATE_IP" != "None" && "$PRIVATE_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
        echo "$PRIVATE_IP"
        exit 0
      fi
      
      sleep 5
    done
    
    # Fallback to known IP if all methods fail
    echo "10.0.20.81"
  register: private_ip_result
  delegate_to: localhost

- name: "Create database namespace"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl create namespace database || true
  become: true

- name: "Check for existing conflicting deployments"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    echo "=== Checking for existing PostgreSQL deployments ==="
    kubectl get pods,svc -n database 2>/dev/null || echo "No database resources found"
    echo "=== Checking port usage ==="
    ss -tuln | grep -E ":(30432|30187)" || echo "Ports 30432 and 30187 available"
  become: true

- name: "🔧 Fix PostgreSQL data directory permissions"
  ansible.builtin.shell: |
    echo "🔧 Fixing PostgreSQL data directory permissions..."
    # Create PostgreSQL data directory if it doesn't exist
    sudo mkdir -p /data/postgresql
    # Fix ownership - PostgreSQL Bitnami image runs as UID 1001
    echo "Setting ownership to UID 1001 (PostgreSQL user)..."
    sudo chown -R 1001:1001 /data/postgresql
    # Set proper permissions
    sudo chmod 755 /data/postgresql
    # Optionally clean existing data only when explicitly requested
    if [ "{{ force_reinit_postgresql_data | default(false) | ternary('true','false') }}" = "true" ]; then echo "Cleaning existing PostgreSQL data as requested..."; sudo rm -rf /data/postgresql/*; else echo "Skipping data wipe (force_reinit_postgresql_data=false)"; fi
    # Verify permissions
    echo "=== PostgreSQL Data Directory Status ==="
    ls -la /data/postgresql
    echo "Owner: $(stat -c '%U:%G' /data/postgresql 2>/dev/null || echo 'unknown')"
    echo "Permissions: $(stat -c '%a' /data/postgresql 2>/dev/null || echo 'unknown')"
    echo "✅ PostgreSQL data directory permissions fixed"
  become: true

- name: "🗑️ Remove existing PostgreSQL deployment (if any)"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    if [ "{{ wipe_postgres_release | default(false) | ternary('true','false') }}" = "true" ]; then
      echo "Removing any existing PostgreSQL deployment (wipe_postgres_release=true)..."
      helm uninstall postgresql -n database 2>/dev/null || echo "No existing PostgreSQL deployment found"
      # Wait a moment for cleanup
      sleep 10
      # Clean up any remaining resources
      kubectl delete pod -n database -l app.kubernetes.io/name=postgresql --force --grace-period=0 2>/dev/null || true
      kubectl delete pvc -n database -l app.kubernetes.io/name=postgresql 2>/dev/null || true
      echo "✅ Cleanup completed"
    else
      echo "Skipping Helm uninstall and PVC deletion (wipe_postgres_release=false)"
    fi
  become: true

- name: "Deploy PostgreSQL using Bitnami chart"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    echo "🚀 Deploying PostgreSQL with proper configuration..."
    helm upgrade --install postgresql bitnami/postgresql --namespace database --set auth.postgresPassword="{{ postgres_password_param.value }}" --set auth.database="appdb" --set primary.persistence.enabled=true --set primary.persistence.size=10Gi --set primary.persistence.storageClass="local-path" --set primary.persistence.existingClaim="" --set primary.securityContext.enabled=true --set primary.securityContext.fsGroup=1001 --set primary.containerSecurityContext.enabled=true --set primary.containerSecurityContext.runAsUser=1001 --set primary.containerSecurityContext.runAsGroup=1001 --set primary.service.type=NodePort --set primary.service.nodePorts.postgresql=30432 --set primary.initdb.scripts."init-db\.sql"="CREATE EXTENSION IF NOT EXISTS pg_stat_statements;" --wait --timeout=15m
    # Mark initialization completed (sentinel)
    sudo touch /data/postgresql/.initialized || true
    echo "✅ PostgreSQL deployment command completed"
  become: true

- name: "Wait for PostgreSQL pod readiness"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s
  register: pg_wait
  retries: 5
  delay: 20
  until: pg_wait.rc == 0
  become: true

- name: "Display PostgreSQL deployment results"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
    kubectl get pods -n database -o wide
    kubectl get svc -n database
  become: true

- name: "Deploy PostgreSQL Exporter"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: List
      items:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-exporter
            namespace: database
            labels:
              app: postgres-exporter
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: postgres-exporter
            template:
              metadata:
                labels:
                  app: postgres-exporter
              spec:
                containers:
                  - name: postgres-exporter
                    image: prometheuscommunity/postgres-exporter:v0.15.0
                    ports:
                      - containerPort: 9187
                        name: metrics
                    env:
                      - name: DATA_SOURCE_NAME
                        valueFrom:
                          secretKeyRef:
                            name: postgres-exporter-secret
                            key: dsn
                      - name: PG_EXPORTER_WEB_LISTEN_ADDRESS
                        value: "0.0.0.0:9187"
                    resources:
                      limits:
                        cpu: 200m
                        memory: 256Mi
                      requests:
                        cpu: 100m
                        memory: 128Mi
                    livenessProbe:
                      httpGet:
                        path: /metrics
                        port: 9187
                      initialDelaySeconds: 60
                      periodSeconds: 30
                    readinessProbe:
                      httpGet:
                        path: /metrics
                        port: 9187
                      initialDelaySeconds: 30
                      periodSeconds: 10
        - apiVersion: v1
          kind: Secret
          metadata:
            name: postgres-exporter-secret
            namespace: database
          type: Opaque
          stringData:
            dsn: "postgresql://postgres:{{ postgres_password_param.value }}@postgresql.database.svc.cluster.local:5432/appdb?sslmode=disable"
        - apiVersion: v1
          kind: Service
          metadata:
            name: postgres-exporter
            namespace: database
            labels:
              app: postgres-exporter
          spec:
            ports:
              - port: 9187
                targetPort: 9187
                nodePort: 30187
                name: metrics
                protocol: TCP
            selector:
              app: postgres-exporter
            type: NodePort
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  become: true

- name: "Create sample data for testing (optional)"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"Waiting for PostgreSQL to be ready...\"",
        "kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=postgresql -n database --timeout=300s",
        "echo \"Creating sample table for testing...\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "POSTGRES_PASSWORD=$(kubectl get secret -n database postgresql -o jsonpath=\"{.data.postgres-password}\" | base64 -d)",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"CREATE TABLE IF NOT EXISTS sample_metrics (id SERIAL PRIMARY KEY, timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP, metric_name VARCHAR(100), metric_value FLOAT, instance_id VARCHAR(50));\"",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"INSERT INTO sample_metrics (metric_name, metric_value, instance_id) VALUES ('"'cpu_usage'"', 45.2, '"'test-instance'"'), ('"'memory_usage'"', 67.8, '"'test-instance'"'), ('"'disk_usage'"', 23.1, '"'test-instance'"') ON CONFLICT DO NOTHING;\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: sample_data_command
  delegate_to: localhost
  when: create_sample_data | default(true)

- name: "Wait for sample data creation"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ sample_data_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: sample_data_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: sample_data_output.stdout is defined
  when: create_sample_data | default(true)

- name: "Comprehensive automated verification"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=[
        "export KUBECONFIG=/etc/rancher/k3s/k3s.yaml",
        "echo \"=== PostgreSQL Deployment Verification ===\"",
        "echo \"1. Checking PostgreSQL Pods:\"",
        "kubectl get pods -n database -l app.kubernetes.io/name=postgresql",
        "echo \"\"",
        "echo \"2. Checking PostgreSQL Services:\"", 
        "kubectl get svc -n database",
        "echo \"\"",
        "echo \"3. Checking Persistence:\"",
        "kubectl get pvc -n database",
        "echo \"\"",
        "echo \"4. Checking PostgreSQL Exporter:\"",
        "kubectl get pods -n database -l app=postgres-exporter",
        "echo \"\"",
        "echo \"5. Testing Database Connection:\"",
        "POSTGRES_POD=$(kubectl get pods -n database -l app.kubernetes.io/name=postgresql -o jsonpath=\"{.items[0].metadata.name}\")",
        "POSTGRES_PASSWORD=$(kubectl get secret -n database postgresql -o jsonpath=\"{.data.postgres-password}\" | base64 -d)",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"SELECT version();\"",
        "echo \"\"",
        "echo \"6. Testing Sample Data:\"",
        "kubectl exec -n database \"$POSTGRES_POD\" -- env PGPASSWORD=\"$POSTGRES_PASSWORD\" psql -U postgres -d appdb -c \"SELECT COUNT(*) as sample_records FROM sample_metrics;\" || echo \"Sample data not created\"",
        "echo \"\"",
        "echo \"7. Testing PostgreSQL Exporter Connectivity:\"",
        "kubectl wait --for=condition=ready pod -l app=postgres-exporter -n database --timeout=120s || echo \"PostgreSQL Exporter not ready yet\"",
        "NODE_IP=$(hostname -I | awk \"{print \\$1}\" || echo \"{{ private_ip_result.stdout }}\")",
        "echo \"Node IP: $NODE_IP\"",
        "curl -s http://$NODE_IP:30187/metrics | grep pg_up || echo \"PostgreSQL Exporter metrics not accessible yet\"",
        "echo \"\"",
        "echo \"8. Testing External Port Connectivity:\"",
        "timeout 5 bash -c \"</dev/tcp/$NODE_IP/30432\" && echo \"PostgreSQL port 30432 accessible\" || echo \"PostgreSQL port 30432 connection failed (normal for PostgreSQL)\"",
        "timeout 5 bash -c \"</dev/tcp/$NODE_IP/30187\" && echo \"PostgreSQL Exporter port 30187 accessible\" || echo \"PostgreSQL Exporter port 30187 connection failed\"",
        "echo \"\"",
        "echo \"=== Deployment Summary ===\"",
        "echo \"PostgreSQL Host: $NODE_IP:30432\"",
        "echo \"PostgreSQL Exporter: $NODE_IP:30187/metrics\"",
        "echo \"Database: appdb\"",
        "echo \"Username: postgres\"",
        "echo \"Password: Stored in Parameter Store and Kubernetes Secret\""
      ]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: verify_command
  delegate_to: localhost

- name: "Get comprehensive verification results"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm get-command-invocation \
      --command-id "{{ verify_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}" \
      --query 'StandardOutputContent' \
      --output text
  register: verify_output
  delegate_to: localhost
  retries: 5
  delay: 20
  until: verify_output.stdout is defined

- name: "Store private IP in Parameter Store for monitoring instance"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/private-ip" \
      --value "{{ private_ip_result.stdout }}" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Store database connection details in Parameter Store"
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/host" \
      --value "{{ private_ip_result.stdout }}" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/port" \
      --value "30432" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/name" \
      --value "appdb" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/username" \
      --value "postgres" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
    
    aws ssm put-parameter \
      --name "/{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/monitoring/postgres-exporter-url" \
      --value "http://{{ private_ip_result.stdout }}:30187/metrics" \
      --type "String" \
      --overwrite \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: "Display PostgreSQL deployment summary"
  debug:
    msg: |
      ============================================
      ✅ PostgreSQL Database Deployment Complete!
      ============================================
      📍 Database Access Information:
         Host: {{ private_ip_result.stdout }}:30432
         Database: appdb
         Username: postgres
         Password: {{ "Newly generated and stored" if postgres_password_param.rc != 0 else "Retrieved from Parameter Store" }}
      
      📊 Monitoring Endpoints:
         PostgreSQL Exporter: {{ private_ip_result.stdout }}:30187/metrics
         Node Exporter: {{ private_ip_result.stdout }}:30100/metrics
      
      🔧 Automated Verification Results:
      {{ verify_output.stdout }}
      
      📦 Parameter Store Values Created:
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/postgres/password
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/host
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/port
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/name
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/database/username
         - /{{ project_name | default('devops-infra') }}/{{ deployment_environment | default('dev') }}/monitoring/postgres-exporter-url
      ============================================ 