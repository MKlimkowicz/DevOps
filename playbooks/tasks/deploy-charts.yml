- name: Create charts directory structure on instance
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters 'commands=["mkdir -p /opt/k8s/charts/node-exporter/{templates,charts}", "chown -R ec2-user:ec2-user /opt/k8s"]' \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: mkdir_command
  delegate_to: localhost

- name: Wait for directory creation
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    aws ssm wait command-executed \
      --command-id "{{ mkdir_command.stdout }}" \
      --instance-id "{{ instance_id }}" \
      --region "{{ aws_region }}"
  delegate_to: localhost

- name: Copy Chart.yaml to instance
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    CHART_CONTENT=$(cat ../charts/node-exporter/Chart.yaml | base64 -w 0)
    aws ssm send-command \
      --document-name "AWS-RunShellScript" \
      --parameters "commands=[\"echo '$CHART_CONTENT' | base64 -d > /opt/k8s/charts/node-exporter/Chart.yaml\"]" \
      --targets "Key=instanceids,Values={{ instance_id }}" \
      --region "{{ aws_region }}" \
      --output text \
      --query 'Command.CommandId'
  register: chart_yaml_command
  delegate_to: localhost

- name: Copy values.yaml to instance  
  ansible.builtin.shell: |
    export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
    VALUES_CONTENT=$(cat ../charts/node-exporter/values.yaml | base64 -w 0)
    aws ssm send-command \
